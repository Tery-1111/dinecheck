<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DineCheck — Hot or Not</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
    header { background: #e63946; padding: 20px; text-align: center; color: white; }
    header h1 { font-size: 2rem; }
    header p { font-size: 0.9rem; opacity: 0.85; }
    .back-btn { display: inline-block; margin: 20px; background: #e63946; color: white; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .container { max-width: 500px; margin: 0 auto; padding: 0 20px 40px; text-align: center; }
    .card-stack { position: relative; height: 380px; margin: 20px auto; }
    .swipe-card { position: absolute; width: 100%; background: white; border-radius: 20px; padding: 40px 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); transition: transform 0.3s, opacity 0.3s; cursor: grab; }
    .swipe-card .meal-emoji { font-size: 5rem; margin-bottom: 15px; }
    .swipe-card .meal-name { font-size: 2rem; font-weight: bold; color: #333; margin-bottom: 8px; }
    .swipe-card .meal-hotel { font-size: 1rem; color: #666; margin-bottom: 6px; }
    .swipe-card .meal-score { font-size: 1rem; color: #f4a261; margin-bottom: 6px; }
    .swipe-card .meal-price { font-size: 0.9rem; color: #2a9d8f; }
    .swipe-out-left { transform: translateX(-150%) rotate(-20deg); opacity: 0; }
    .swipe-out-right { transform: translateX(150%) rotate(20deg); opacity: 0; }
    .swipe-out-up { transform: translateY(-150%); opacity: 0; }
    .buttons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .btn-pass { background: #e63946; color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(230,57,70,0.3); }
    .btn-info { background: #457b9d; color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(69,123,157,0.3); }
    .btn-hot { background: #2a9d8f; color: white; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 15px rgba(42,157,143,0.3); }
    .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 0.8rem; color: #666; }
    .score-display { margin-top: 20px; background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .score-display h3 { margin-bottom: 10px; font-size: 1rem; }
    .score-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 4px 0; border-bottom: 1px solid #f5f5f5; }
    .empty-state { padding: 60px 20px; color: #999; }
    .empty-state p { font-size: 1.1rem; margin-bottom: 10px; }
    .label-hot { position: absolute; top: 20px; left: 20px; background: #2a9d8f; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 1rem; opacity: 0; transition: opacity 0.2s; }
    .label-pass { position: absolute; top: 20px; right: 20px; background: #e63946; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 1rem; opacity: 0; transition: opacity 0.2s; }
  </style>
</head>
<body>
  <header>
    <h1>🍛 DineCheck</h1>
    <p>Hot or Not — Meal Discovery</p>
  </header>
  <a class="back-btn" href="/">← Back to Home</a>
  <div class="container">
    <div class="card-stack" id="cardStack"></div>
    <div class="buttons">
      <button class="btn-pass" onclick="swipe('pass')" title="Hard Pass">❌</button>
      <button class="btn-info" onclick="swipe('info')" title="Need More Info">🤔</button>
      <button class="btn-hot" onclick="swipe('hot')" title="Looks Good!">✅</button>
    </div>
    <div class="legend">
      <span>❌ Hard Pass</span>
      <span>🤔 Need Info</span>
      <span>✅ Looks Good</span>
    </div>
    <div class="score-display" id="scoreDisplay" style="display:none">
      <h3>📊 Your Session</h3>
      <div class="score-row"><span>✅ Looks Good</span><span id="hotCount">0</span></div>
      <div class="score-row"><span>🤔 Need Info</span><span id="infoCount">0</span></div>
      <div class="score-row"><span>❌ Hard Pass</span><span id="passCount">0</span></div>
    </div>
  </div>

  <script>
    let meals = [];
    let currentIndex = 0;
    let scores = { hot: 0, info: 0, pass: 0 };

    const MEAL_EMOJIS = {
      'Chapo': '🫓', 'Beans': '🫘', 'Beef': '🥩', 'Pilau': '🍛',
      'Samaki': '🐟', 'Kuku': '🍗', 'Chafua': '🍲', 'Chips': '🍟',
      'Uji': '🥣', 'Githeri': '🌽', 'Matumbo': '🫀'
    };

    function buildMealCards() {
      fetch('/api/hotels')
        .then(res => res.json())
        .then(hotels => {
          fetch('/api/meals')
            .then(res => res.json())
            .then(mealList => {
              meals = [];
              hotels.forEach(hotel => {
                const hotelMeals = hotel.meals.split(',').map(m => m.trim());
                hotelMeals.forEach(mealName => {
                  const matched = mealList.find(m => m.name.toLowerCase() === mealName.toLowerCase());
                  const avg = hotel.ratings.filter(r => r.meal.toLowerCase() === mealName.toLowerCase());
                  const avgScore = avg.length > 0
                    ? (avg.reduce((s, r) => s + r.score, 0) / avg.length).toFixed(1)
                    : null;
                  meals.push({
                    hotel: hotel.name,
                    hotelId: hotel.id,
                    meal: mealName,
                    emoji: MEAL_EMOJIS[mealName] || '🍽️',
                    avgScore,
                    ratings: avg.length
                  });
                });
              });
              meals = meals.sort(() => Math.random() - 0.5);
              renderCard();
            });
        });
    }

    function renderCard() {
      const stack = document.getElementById('cardStack');
      stack.innerHTML = '';
      if (currentIndex >= meals.length) {
        stack.innerHTML = `
          <div class="empty-state">
            <p>🎉 You've seen all meals!</p>
            <p style="font-size:0.9rem">Come back after more hotels are added.</p>
          </div>`;
        document.getElementById('scoreDisplay').style.display = 'block';
        return;
      }
      const m = meals[currentIndex];
      stack.innerHTML = `
        <div class="swipe-card" id="currentCard">
          <div class="label-hot" id="labelHot">LOOKS GOOD</div>
          <div class="label-pass" id="labelPass">HARD PASS</div>
          <div class="meal-emoji">${m.emoji}</div>
          <div class="meal-name">${m.meal}</div>
          <div class="meal-hotel">🏨 ${m.hotel}</div>
          ${m.avgScore ? '<div class="meal-score">⭐ ' + m.avgScore + '/10 from ' + m.ratings + ' rating(s)</div>' : '<div class="meal-score">No ratings yet</div>'}
          <a href="/hotel.html?id=${m.hotelId}" style="display:inline-block;margin-top:15px;background:#e63946;color:white;padding:6px 16px;border-radius:20px;font-size:0.85rem;text-decoration:none">View Hotel</a>
        </div>`;
      document.getElementById('scoreDisplay').style.display = 'block';
    }

    function swipe(type) {
      const card = document.getElementById('currentCard');
      if (!card) return;
      scores[type]++;
      document.getElementById('hotCount').textContent = scores.hot;
      document.getElementById('infoCount').textContent = scores.info;
      document.getElementById('passCount').textContent = scores.pass;

      if (type === 'hot') {
        document.getElementById('labelHot').style.opacity = '1';
        card.classList.add('swipe-out-right');
      } else if (type === 'pass') {
        document.getElementById('labelPass').style.opacity = '1';
        card.classList.add('swipe-out-left');
      } else {
        card.classList.add('swipe-out-up');
      }

      setTimeout(() => {
        currentIndex++;
        renderCard();
      }, 300);
    }

    buildMealCards();
  </script>
</body>
</html>
